spring.application.name=api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pick_a_spice}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=none
app.auth.login-attempts-per-window=10
app.auth.new-sessions-per-window=20
app.auth.traffic-window=1m
app.auth.concurrent-logins=2
app.auth.max-tracked-sources=10000
app.auth.max-sessions=1000
app.auth.maximum-session-age=1h
